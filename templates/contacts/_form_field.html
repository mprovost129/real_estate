<div class="{{ col }}">
  <label for="{{ field.id_for_label }}"
         style="display:block;font-size:.8125rem;font-weight:500;color:var(--text-secondary);margin-bottom:.25rem;">
    {{ field.label }}{% if field.field.required %} <span style="color:var(--color-danger);">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.errors %}
    <p style="font-size:.75rem;color:var(--color-danger);margin-top:.25rem;">{{ field.errors.0 }}</p>
  {% endif %}
  {% if field.help_text %}
    <p style="font-size:.75rem;color:var(--text-muted);margin-top:.25rem;">{{ field.help_text }}</p>
  {% endif %}
</div>
