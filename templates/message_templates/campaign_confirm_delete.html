{% extends "base_app.html" %}

{% block title %}Delete Campaign{% endblock %}
{% block page_title %}Delete Campaign{% endblock %}

{% block content %}
<div class="card" style="max-width:700px;">
  <div class="card-body">
    <p>Delete campaign <strong>{{ campaign.name }}</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger btn-sm">Delete</button>
      <a href="{% url 'message_templates:campaign_detail' campaign.pk %}" class="btn btn-ghost btn-sm">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
