{% extends "base_auth.html" %}
{% block title %}Check your email{% endblock %}

{% block card %}
<div class="text-center">
  <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-green-100 dark:bg-green-900/30 mb-4">
    <svg class="w-6 h-6 text-green-600 dark:text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
    </svg>
  </div>
  <h2 class="text-xl font-semibold mb-2">Check your inbox</h2>
  <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">
    If an account exists for that email, we've sent a password reset link. Check your spam folder if you don't see it.
  </p>
  <a href="{% url 'login' %}" class="text-brand-600 hover:underline text-sm">Back to sign in</a>
</div>
{% endblock %}
