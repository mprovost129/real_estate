{% extends "base_auth.html" %}
{% block title %}Change password{% endblock %}

{% block card %}
<h2 class="text-xl font-semibold mb-6">Change your password</h2>

<form method="post" novalidate class="space-y-4">
  {% csrf_token %}
  {% for field in form %}
    <div>
      <label for="{{ field.id_for_label }}" class="block text-sm font-medium mb-1">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<p class="mt-1 text-xs text-red-600">{{ field.errors.0 }}</p>{% endif %}
    </div>
  {% endfor %}
  <button type="submit" class="w-full py-2.5 px-4 bg-brand-500 hover:bg-brand-600 text-white font-medium rounded-lg transition">
    Update password
  </button>
</form>
{% endblock %}

{% block extra_head %}
<style>
  input[type=password] { display:block;width:100%;padding:.5rem .75rem;border:1px solid #d1d5db;border-radius:.5rem;font-size:.875rem;background:white;outline:none; }
  input:focus { border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15); }
  .dark input { background:#111827;border-color:#374151;color:#f9fafb; }
</style>
{% endblock %}
